services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: ${container_name}
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    volumes:
    - sabnzbd-swarm:/config
    - /media/Multimedia/Incoming/:/downloads
    - /media/Multimedia/Incoming/incomplete/:/incomplete-downloads
    ports:
    - target: 8080
      published: 8086
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.sabnzbd == true
      restart_policy:
        condition: any
volumes:
  sabnzbd-swarm:
    name: sabnzbd-swarm
